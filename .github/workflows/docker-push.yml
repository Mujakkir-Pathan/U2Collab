name: Docker Push

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable tag to push (e.g. sha-abc1234)
        required: true
        type: string

jobs:
  build-push:
    runs-on: ubuntu-latest        # amd64 — matches the EKS nodes
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same-origin URLs: the Gateway routes /api and /socket.io to the
          # server, and the client image is host-agnostic. Build-time only —
          # they are baked into the Vite bundle.
          - folder: client
            build_args: |
              VITE_API_URL=/api
              VITE_SOCKET_URL=/
          - folder: server
            build_args: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Setup [Login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.folder }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/u2collab-${{ matrix.folder }}:${{ inputs.image_tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/u2collab-${{ matrix.folder }}:latest
