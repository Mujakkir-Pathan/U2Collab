name: Code Tests

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      # No test runner is wired up in the client yet — a production build
      # is the strongest compile check available.
      - name: Client Build (compile check)
        run: npm run build
        working-directory: client

      - name: Install Server Dependencies
        run: npm ci --omit=dev
        working-directory: server

      - name: Server Syntax Tests
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check
        working-directory: server

      - name: Server Import Smoke Test
        # Loading app.js without a DB would exit(1); instead import the
        # pure utilities to prove the ESM graph resolves.
        run: node -e "import('./utils/jwt.js').then(() => console.log('jwt utils ok'))"
        working-directory: server
