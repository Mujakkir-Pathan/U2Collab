name: Code Quality

on:
  workflow_call:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup NodeJs
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Packages
        run: npm ci
        working-directory: client

      - name: Run Client Linter
        run: npm run lint
        working-directory: client

      - name: Install Server Packages
        run: npm ci --omit=dev
        working-directory: server

      - name: Syntax-check Server Sources
        # The server has no linter configured; `node --check` catches
        # syntax errors without needing a DB connection.
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check
        working-directory: server
