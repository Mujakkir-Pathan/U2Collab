# Local dev only (`make up`). GitHub Actions + ArgoCD own the Kubernetes path.
#
# Tags come from .env (make setup): CLIENT_TAG / SERVER_TAG.
services:
  client:
    build:
      context: ./client
      args:
        # Same-origin defaults: nginx proxies /api and /socket.io to `server`.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-/}
    image: charanbavaji/u2collab-client:${CLIENT_TAG:-latest}
    container_name: u2collab-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_HOST_PORT:-5173}:80"

  server:
    build: ./server
    image: charanbavaji/u2collab-server:${SERVER_TAG:-latest}
    container_name: u2collab-server
    restart: unless-stopped
    # SERVER_ENV_FILE defaults to ./server/.env; override it in .env.
    env_file:
      - ${SERVER_ENV_FILE:-./server/.env}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${SERVER_HOST_PORT:-5000}:5000"
