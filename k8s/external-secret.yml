apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: u2collab-secrets
  namespace: u2collab
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: u2collab-secrets
    creationPolicy: Owner
    deletionPolicy: Delete

    # The AWS Secrets Manager JSON (key u2collab/server) must hold:
    #   MONGO_URI, JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
    #   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, CLIENT_URL
    # Static, non-sensitive values are templated here so they never need a trip
    # through AWS.
    template:
      engineVersion: v2
      type: Opaque
      data:
        MONGO_URI: "{{ .MONGO_URI }}"
        JWT_SECRET: "{{ .JWT_SECRET }}"
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
        GITHUB_CLIENT_ID: "{{ .GITHUB_CLIENT_ID }}"
        GITHUB_CLIENT_SECRET: "{{ .GITHUB_CLIENT_SECRET }}"
        CLIENT_URL: "{{ .CLIENT_URL }}"
        PORT: "5000"
        NODE_ENV: "production"

  dataFrom:
    - extract:
        key: u2collab/server
