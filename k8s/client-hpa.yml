apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: u2collab-client-hpa
  namespace: u2collab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: u2collab-client-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
