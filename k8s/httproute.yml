apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: u2collab-route
  namespace: u2collab
spec:
  parentRefs:
    - name: u2collab-gateway
  rules:
    # REST API — Express mounts everything under /api.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: server
          port: 5000

    # Socket.IO lives on its own path prefix on the SAME server port.
    # The long timeouts keep WebSockets (and Yjs sync) from being cut off.
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      timeouts:
        request: "3600s"
        backendRequest: "3600s"
      backendRefs:
        - name: server
          port: 5000

    # Everything else is the SPA.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: u2collab-client-service
          port: 8080
