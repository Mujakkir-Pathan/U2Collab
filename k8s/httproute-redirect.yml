# Scoped to the hostname so the raw load balancer URL still works unredirected.
# Does not break ACME: same hostname, so Gateway API falls to match precedence,
# and the solver's Exact path beats this PathPrefix.
# sectionName is required, or this attaches to :443 too and loops.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: u2collab-https-redirect
  namespace: u2collab
spec:
  parentRefs:
    - name: u2collab-gateway
      sectionName: http
  hostnames:
    - u2collab.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
