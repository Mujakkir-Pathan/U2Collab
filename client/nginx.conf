server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxy. With VITE_API_URL=/api and VITE_SOCKET_URL=/,
    # the browser only ever talks to this origin — works in docker-compose,
    # behind the Kubernetes Gateway, or any host that can resolve `server`.
    # The Gateway routes /api and /socket.io directly, so in-cluster this
    # block is just a second door, not a requirement.
    location /api {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        # $http_host (not $host) — $host drops the port, which breaks OAuth:
        # passport builds redirect_uri from Host, and Google requires an
        # exact match (redirect_uri_mismatch otherwise).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — WebSocket upgrade on the same server port.
    location /socket.io {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # $http_host (not $host) — $host drops the port, which breaks OAuth:
        # passport builds redirect_uri from Host, and Google requires an
        # exact match (redirect_uri_mismatch otherwise).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
