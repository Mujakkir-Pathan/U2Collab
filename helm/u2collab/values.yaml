nameOverride: ""
fullnameOverride: ""
externalSecrets:
  enabled: true
  # AWS Secrets Manager JSON key holding: MONGO_URI, JWT_SECRET,
  # GOOGLE_CLIENT_ID/SECRET, GITHUB_CLIENT_ID/SECRET, CLIENT_URL.
  secretKey: u2collab/server
  storeName: aws-secrets-manager
  refreshInterval: 1h
server:
  image:
    repository: mujakkirpathan/u2collab-server
    # CI (gitops-bump) replaces this with an immutable sha-* tag.
    tag: sha-cb62826
    pullPolicy: IfNotPresent
  # Pinned at 1 on purpose: Yjs docs, whiteboard state and presence live in
  # in-memory Maps, and Socket.IO has no Redis adapter. Raise only after adding
  # @socket.io/redis-adapter and shared state.
  replicas: 1
  serviceName: server
  port: 5000
  # production => secure + sameSite=none cookies, which requires HTTPS on the
  # public origin. On plain HTTP (NLB URL only) set this to development.
  nodeEnv: production
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
client:
  image:
    repository: mujakkirpathan/u2collab-client
    tag: sha-cb62826
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 80
  servicePort: 8080
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
  # Mounts a lazy-resolving nginx config (resolver + variable upstream) over
  # the client image's static one. Without it nginx crash-loops in k3s when
  # CoreDNS is not up yet: "host not found in upstream \"server\"".
  nginxConfig:
    enabled: true
    # Cluster DNS ClusterIP. k3s/kubeadm default below — override per cluster
    # (EKS CoreDNS is often 172.20.0.10, kind is 10.96.0.10).
    resolver: "10.43.0.10"
gateway:
  enabled: true
  className: envoy
  listenerPort: 80
  # Empty accepts any Host, which is what the raw load balancer URL needs.
  hostname: ""
  # Propagated (via Gateway infrastructure.annotations) to the Envoy
  # data-plane Service. On EKS the in-tree provider turns this into a real
  # NLB instead of a Classic ELB; kind/k3s/minikube simply ignore it.
  serviceAnnotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  # Off by default: the chart must still work with no cert-manager and no domain.
  # NOTE: with hostname set and TLS off, keep server.nodeEnv=development or the
  # secure cookies will not travel over plain HTTP.
  tls:
    enabled: false
    port: 443
    # Must be in the Gateway's namespace. Empty -> "<fullname>-tls".
    secretName: ""
    createCertificate: true
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
    httpsRedirect: true
# The shared ClusterIssuers in gitops/cert-manager/ hard-wire their solver to the
# RAW stack's Gateway, so the Helm stack needs its own Issuer. Each stack gets
# its own load balancer, so they need separate hostnames and DNS records.
certManager:
  createIssuer: false
  issuerName: ""
  server: https://acme-v02.api.letsencrypt.org/directory
  email: charanbavaji.official@gmail.com
