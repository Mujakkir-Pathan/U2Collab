{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "u2collab.fullname" . }}-route
  labels:
    {{- include "u2collab.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "u2collab.fullname" . }}-gateway
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    # REST API — Express mounts everything under /api.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.server.serviceName }}
          port: {{ .Values.server.port }}

    # Socket.IO on the same server port. The long timeouts keep WebSockets
    # (and Yjs sync) from being cut off mid-collaboration.
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      timeouts:
        request: "3600s"
        backendRequest: "3600s"
      backendRefs:
        - name: {{ .Values.server.serviceName }}
          port: {{ .Values.server.port }}

    # Everything else is the SPA.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: u2collab-client-service
          port: {{ .Values.client.servicePort }}
{{- end }}
