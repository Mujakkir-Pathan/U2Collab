apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.server.serviceName }}
  labels:
    {{- include "u2collab.labels" . | nindent 4 }}
    app: u2collab-server
spec:
  selector:
    app: u2collab-server
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
