{{- if .Values.client.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "u2collab.fullname" . }}-client-hpa
  labels:
    {{- include "u2collab.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "u2collab.fullname" . }}-client
  minReplicas: {{ .Values.client.hpa.minReplicas }}
  maxReplicas: {{ .Values.client.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.client.hpa.targetCPUUtilizationPercentage }}
{{- end }}
