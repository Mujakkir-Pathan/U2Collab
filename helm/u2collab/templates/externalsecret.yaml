{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: u2collab-secrets
  labels:
    {{- include "u2collab.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore

  target:
    name: u2collab-secrets
    creationPolicy: Owner
    deletionPolicy: Delete

    # The AWS Secrets Manager JSON must hold: MONGO_URI, JWT_SECRET,
    # GOOGLE_CLIENT_ID/SECRET, GITHUB_CLIENT_ID/SECRET, CLIENT_URL.
    template:
      engineVersion: v2
      type: Opaque
      data:
        MONGO_URI: "{{ `{{ .MONGO_URI }}` }}"
        JWT_SECRET: "{{ `{{ .JWT_SECRET }}` }}"
        GOOGLE_CLIENT_ID: "{{ `{{ .GOOGLE_CLIENT_ID }}` }}"
        GOOGLE_CLIENT_SECRET: "{{ `{{ .GOOGLE_CLIENT_SECRET }}` }}"
        GITHUB_CLIENT_ID: "{{ `{{ .GITHUB_CLIENT_ID }}` }}"
        GITHUB_CLIENT_SECRET: "{{ `{{ .GITHUB_CLIENT_SECRET }}` }}"
        CLIENT_URL: "{{ `{{ .CLIENT_URL }}` }}"
        PORT: {{ .Values.server.port | quote }}
        NODE_ENV: {{ .Values.server.nodeEnv | quote }}

  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.secretKey }}
{{- end }}
