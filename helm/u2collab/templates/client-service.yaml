apiVersion: v1
kind: Service
metadata:
  name: u2collab-client-service
  labels:
    {{- include "u2collab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: u2collab-client
  ports:
    - protocol: TCP
      port: {{ .Values.client.servicePort }}
      targetPort: {{ .Values.client.containerPort }}
