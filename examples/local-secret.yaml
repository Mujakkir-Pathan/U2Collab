# EXAMPLE ONLY — DO NOT apply this in the k8s/ directory flow.
# It used to live in k8s/ under the same name (u2collab-secrets) as the
# ExternalSecret target and would clobber real credentials on `kubectl apply -f k8s/`.
# Kept here for local/docker-compose experimentation; rename the Secret before use.
apiVersion: v1
kind: Secret
metadata:
  name: u2collab-secrets
  namespace: u2collab
type: Opaque
stringData:
  MONGO_URI: PLACEHOLDER_MONGO_URI
  JWT_SECRET: PLACEHOLDER_JWT_SECRET
  GOOGLE_CLIENT_ID: PLACEHOLDER_GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET: PLACEHOLDER_GOOGLE_CLIENT_SECRET
  GITHUB_CLIENT_ID: PLACEHOLDER_GITHUB_CLIENT_ID
  GITHUB_CLIENT_SECRET: PLACEHOLDER_GITHUB_CLIENT_SECRET
  CLIENT_URL: "http://localhost"
  PORT: "5000"
  NODE_ENV: "development"
